:environment:
  :entries:
  - :name: ^hostname$
    :type: string
:stream_classes:
- :default_clock_class: {}
  :event_common_context_field_class:
    :type: structure
    :members:
    - :name: ^vpid$
      :field_class:
        :type: integer_signed
    - :name: ^vtid$
      :field_class:
        :type: integer_unsigned
  :event_classes:
  # Restrict the bare entry/exit patterns to the MPI provider so that
  # ze allocation/free events sourced from the ze backend (see below)
  # do not accidentally match them.
  - :set_id: entries
    :name: "^lttng_ust_mpi:.*_entry$"
  - :set_id: exits
    :register: false
    :name: "^lttng_ust_mpi:.*_exit$"
  - :set_id: exits_mpiError_present
    :domain: exits
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^mpiResult$
        :field_class:
          :type: integer_signed
          :cast_type: ^int$
  - :set_id: exits_mpiError_absent
    :domain: exits - exits_mpiError_present
  - :set_id: traffic_MPI_Count_entry
    :domain: entries
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^(count|origin_count)$
        :field_class:
          :cast_type: ^MPI_Count$
      - :name: ^(datatype|origin_count)$
        :field_class:
          :cast_type: MPI_Datatype
  - :set_id: traffic_int_entry
    :domain: entries
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^(count|origin_count)$
        :field_class:
          :cast_type: ^int$
      - :name: ^(datatype|origin_count)$
        :field_class:
          :cast_type: MPI_Datatype
  # ------------------------------------------------------------------
  # GPU-aware MPI tagging
  #
  # Categories below feed btx_mpiinterval_callbacks.cpp's range-map
  # lookup. The MPI buffer categories capture the payload pointer(s)
  # of every buffer-bearing MPI call; the ze alloc/free categories
  # maintain a {hostname,vpid} -> address-range map. An MPI call whose
  # buffer falls in the range-map is tagged with a leading '*' in the
  # tally output. This is only effective when the user enables both
  # --backend mpi and --backend ze; with only --backend mpi the
  # range-map stays empty and no '*' ever appears.
  # ------------------------------------------------------------------
  # MPI buffer categories. metababel requires each :name: regex to bind
  # to EXACTLY ONE field per matched event, so we cannot lump all buffer
  # names into a single regex slot: an event like MPI_Reduce_local has
  # both `inbuf` and `inoutbuf`, and MPI_Compare_and_swap has three
  # buffer fields, which would over-match. Define one category per
  # distinct MPI buffer-shape, then a catch-all for single-buffer calls.
  # The cast_type accepts both `const void *` (input buffers) and plain
  # `void *` (output buffers) since MPI prototypes use both.
  #
  # 3-buffer: MPI_Compare_and_swap
  - :set_id: mpi_cas_entry
    :domain: entries
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^origin_addr$
        :field_class:
          :cast_type: ^(const )?void \*$
      - :name: ^compare_addr$
        :field_class:
          :cast_type: ^(const )?void \*$
      - :name: ^result_addr$
        :field_class:
          :cast_type: ^(const )?void \*$
  # 2-buffer Send/Recv pair (Sendrecv, Allreduce, Reduce, Gather, ...).
  - :set_id: mpi_sendrecv_entry
    :domain: entries - mpi_cas_entry
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^sendbuf$
        :field_class:
          :cast_type: ^(const )?void \*$
      - :name: ^recvbuf$
        :field_class:
          :cast_type: ^(const )?void \*$
  # 2-buffer Reduce_local pair (inbuf + inoutbuf).
  - :set_id: mpi_reduce_local_entry
    :domain: entries - mpi_cas_entry - mpi_sendrecv_entry
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^inbuf$
        :field_class:
          :cast_type: ^(const )?void \*$
      - :name: ^inoutbuf$
        :field_class:
          :cast_type: ^(const )?void \*$
  # 2-buffer RMA fetch pair (Get_accumulate, Fetch_and_op).
  - :set_id: mpi_rma_fetch_entry
    :domain: entries - mpi_cas_entry - mpi_sendrecv_entry - mpi_reduce_local_entry
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^origin_addr$
        :field_class:
          :cast_type: ^(const )?void \*$
      - :name: ^result_addr$
        :field_class:
          :cast_type: ^(const )?void \*$
  # 1-buffer everything else (Send/Recv/Bcast/Put/Get/Accumulate/...).
  - :set_id: mpi_1buf_entry
    :domain: entries - mpi_cas_entry - mpi_sendrecv_entry - mpi_reduce_local_entry - mpi_rma_fetch_entry
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^(sendbuf|buf|buffer|inbuf|outbuf|inoutbuf|origin_addr|result_addr)$
        :field_class:
          :cast_type: ^(const )?void \*$
  # Level Zero USM allocation / free events sourced from the ze
  # backend (see backends/ze/btx_zematching_model.yaml for matching
  # parents). We bind size at entry and the allocated pointer at exit,
  # mirroring btx_zeinterval_callbacks.cpp:entries_alloc / exits_alloc.
  - :set_id: ze_alloc_entry
    :name: "^lttng_ust_ze:zeMemAlloc.*_entry$"
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^size$
  # We deliberately omit zeResult here so that the consumer callback
  # signature does not need to depend on ze_api.h. A failed allocation
  # has pptr_val == NULL, which the callback already guards against.
  - :set_id: ze_alloc_exit
    :name: "^lttng_ust_ze:zeMemAlloc.*_exit$"
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^pptr_val$
  - :set_id: ze_free_entry
    :name: "^lttng_ust_ze:zeMemFree_entry$"
    :payload_field_class:
      :type: structure
      :members:
      - :name: ^ptr$
