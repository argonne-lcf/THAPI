lttng_ust_ze_profiling:
  events:
  - name: event_profiling
    args:
    - [ze_event_handle_t, hEvent]
    fields:
    - [ctf_integer_hex, uintptr_t, hEvent, "(uintptr_t)hEvent"]
  - name: event_profiling_results
    args:
    - [ze_event_handle_t, hEvent]
    - [ze_result_t, status]
    - [ze_result_t, timestampStatus]
    - [uint64_t, globalStart]
    - [uint64_t, globalEnd]
    - [uint64_t, contextStart]
    - [uint64_t, contextEnd]
    fields:
    - [ctf_integer_hex, uintptr_t, hEvent, "(uintptr_t)hEvent"]
    - [ctf_integer, ze_result_t, status, "status"]
    - [ctf_integer, ze_result_t, timestampStatus, "timestampStatus"]
    - [ctf_integer, uint64_t, globalStart, "globalStart"]
    - [ctf_integer, uint64_t, globalEnd, "globalEnd"]
    - [ctf_integer, uint64_t, contextStart, "contextStart"]
    - [ctf_integer, uint64_t, contextEnd, "contextEnd"]
lttng_ust_ze_properties:
  events:
  - name: driver
    args:
    - [ze_driver_handle_t, hDriver]
    - [ze_driver_properties_t *, pDriverProperties]
    fields:
    - [ctf_integer_hex, uintptr_t, hDriver, "(uintptr_t)hDriver"]
    - [lttng_ust_field_variable_length_blob, pDriverProperties_val, pDriverProperties, size_t, "sizeof(ze_driver_properties_t)", "application/octet-stream"]
  - name: device
    args:
    - [ze_driver_handle_t, hDriver]
    - [ze_device_handle_t, hDevice]
    - [ze_device_properties_t *, pDeviceProperties]
    fields:
    - [ctf_integer_hex, uintptr_t, hDriver, "(uintptr_t)hDriver"]
    - [ctf_integer_hex, uintptr_t, hDevice, "(uintptr_t)hDevice"]
    - [lttng_ust_field_variable_length_blob, pDeviceProperties_val, pDeviceProperties, size_t, "sizeof(ze_device_properties_t)", "application/octet-stream"]
  - name: subdevice
    args:
    - [ze_driver_handle_t, hDriver]
    - [ze_device_handle_t, hDevice]
    - [ze_device_handle_t, hSubDevice]
    - [ze_device_properties_t *, pDeviceProperties]
    fields:
    - [ctf_integer_hex, uintptr_t, hDriver, "(uintptr_t)hDriver"]
    - [ctf_integer_hex, uintptr_t, hDevice, "(uintptr_t)hDevice"]
    - [ctf_integer_hex, uintptr_t, hSubDevice, "(uintptr_t)hSubDevice"]
    - [lttng_ust_field_variable_length_blob, pDeviceProperties_val, pDeviceProperties, size_t, "sizeof(ze_device_properties_t)", "application/octet-stream"]
  - name: command_queue_group
    args:
    - [ze_driver_handle_t, hDriver]
    - [ze_device_handle_t, hDevice]
    - [uint32_t, pCount]
    - [ze_command_queue_group_properties_t *, pGroupProperties]
    fields:
    - [ctf_integer_hex, uintptr_t, hDriver, "(uintptr_t)hDriver"]
    - [ctf_integer_hex, uintptr_t, hDevice, "(uintptr_t)hDevice"]
    - [ctf_integer, uint32_t, pCount, pCount]
    - [lttng_ust_field_variable_length_blob, pGroupProperties_vals, pGroupProperties, size_t, "pCount * sizeof(ze_command_queue_group_properties_t)", "application/octet-stream"]
  - name: device_timer
    args:
    - [ze_device_handle_t, hDevice]
    - [uint64_t, hostTimestamp]
    - [uint64_t, deviceTimestamp]
    fields:
    - [ctf_integer_hex, uintptr_t, hDevice, "(uintptr_t)hDevice"]
    - [ctf_integer, uint64_t, hostTimestamp, hostTimestamp]
    - [ctf_integer, uint64_t, deviceTimestamp, deviceTimestamp]
  - name: memory_info_properties
    args:
    - [ze_context_handle_t, hContext]
    - [const void *, ptr]
    - [ze_memory_allocation_properties_t *, pMemAllocProperties]
    - [ze_device_handle_t, hDevice]
    fields:
    - [ctf_integer_hex, uintptr_t, hContext, "(uintptr_t)hContext"]
    - [ctf_integer_hex, uintptr_t, ptr, "(uintptr_t)ptr"]
    - [lttng_ust_field_variable_length_blob, pMemAllocProperties_val, pMemAllocProperties, size_t, "sizeof(ze_memory_allocation_properties_t)", "application/octet-stream"]
    - [ctf_integer_hex, uintptr_t, hDevice, "(uintptr_t)hDevice"]
  - name: memory_info_range
    args:
    - [ze_context_handle_t, hContext]
    - [const void *, ptr]
    - [const void *, base]
    - [size_t, size]
    fields:
    - [ctf_integer_hex, uintptr_t, hContext, "(uintptr_t)hContext"]
    - [ctf_integer_hex, uintptr_t, ptr, "(uintptr_t)ptr"]
    - [ctf_integer_hex, uintptr_t, base, "(uintptr_t)base"]
    - [ctf_integer, size_t, size, size]
  - name: kernel
    args:
    - [ze_kernel_handle_t, hKernel]
    - [ze_kernel_properties_t *, pKernelProperties]
    fields:
    - [ctf_integer_hex, uintptr_t, hKernel, "(uintptr_t)hKernel"]
    - [lttng_ust_field_variable_length_blob, pKernelProperties_val, pKernelProperties, size_t, "sizeof(ze_kernel_properties_t)", "application/octet-stream"]
lttng_ust_ze_build:
  events:
  - name: log
    args:
    - [const char *, buildLog]
    fields:
    - [ctf_string, buildLog, buildLog]
